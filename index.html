<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riff Boi</title>
  <!-- App icon and "Add to Home Screen": opens full-screen like an app, with the blackletter R icon -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b0b0b">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- Fonts from Google Fonts: UnifrakturCook (logo and titles, picked by the learner), Oswald (labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Each <section> is one screen. app.js shows one at a time. -->

  <!-- Home: Latest Riffs -->
  <section id="screen-home" class="screen">
    <header class="home-top">
      <h1 class="logo">Riff Boi</h1>
      <button id="tuner-btn" class="secondary-btn tuner-btn">Tuner</button>
    </header>
    <button id="new-riff-btn" class="record-btn"><span class="record-dot" aria-hidden="true"></span>New Riff</button>
    <!-- Settings for the tab: the tempo you play at (for note values), or Auto (Riff Boi works it
         out from your notes when you tap Stop), the time signature, and rhythm on/off -->
    <div class="settings-row">
      <div class="tempo">
        <span class="setting-label">Tempo</span>
        <button id="bpm-down" class="step-btn" aria-label="Slower">−</button>
        <input id="bpm-input" class="bpm-input" type="number" inputmode="numeric" min="40" max="240" step="1" value="120" aria-label="Tempo in beats per minute">
        <span class="setting-unit">BPM</span>
        <button id="bpm-up" class="step-btn" aria-label="Faster">+</button>
      </div>
      <label class="rhythm-switch" title="Work out the tempo from my notes when I tap Stop"><input id="auto-tempo-input" type="checkbox" aria-label="Auto tempo: work it out from my notes when I tap Stop"> <span class="setting-label">Auto</span></label>
      <label class="meter-picker"><span class="setting-label">Time</span> <select id="meter-select" class="input-select" aria-label="Time signature"></select></label>
      <label class="rhythm-switch"><input id="rhythm-input" type="checkbox" checked> <span class="setting-label">Rhythm</span></label>
    </div>
    <!-- Which input Riff Boi listens to: the mic or your audio interface (remembered between visits) -->
    <label class="input-picker">
      <span class="setting-label">Input</span>
      <select id="input-select" class="input-select"><option value="">Default input</option></select>
    </label>
    <!-- Only shown when the address ends in ?debug (for tuning note detection) -->
    <button id="save-readings-btn" class="small-btn" hidden>Save last recording's readings</button>
    <h2 class="screen-title">Latest Riffs</h2>
    <p id="no-riffs-msg" class="muted">No riffs yet</p>
    <ul id="riff-list" class="riff-list"></ul>
  </section>

  <!-- Recording -->
  <section id="screen-recording" class="screen" hidden>
    <div class="rec-bar"><span class="rec-dot" aria-hidden="true"></span><span>Listening…</span><span id="rec-time" class="rec-time">0:00</span></div>
    <div class="note-display">
      <span id="note-name" class="note-name">–</span>
      <span id="note-freq" class="note-freq">Play a note</span>
    </div>
    <div id="live-tab" class="tab"></div>
    <!-- Confidence bar: how sure Riff Boi is about the tab (filled in by app.js) -->
    <div id="live-confidence" class="confidence">
      <div class="confidence-label"><span>Confidence</span><span class="confidence-pct">–</span></div>
      <div class="confidence-bar" role="meter" aria-label="Confidence" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="confidence-fill"></div></div>
      <p class="confidence-hint"></p>
    </div>
    <!-- Messages like "Can't hear your guitar", with a hint about what to try -->
    <div class="status">
      <p id="status-msg" class="status-msg"></p>
      <p id="status-hint" class="status-hint"></p>
    </div>
    <!-- Only shown when the address ends in ?debug: the mic's numbers, to find out why a phone can't hear -->
    <p id="debug-info" class="debug-info" hidden></p>
    <button id="stop-btn" class="big-btn bottom-btn">Stop</button>
  </section>

  <!-- Tuner -->
  <section id="screen-tuner" class="screen" hidden>
    <h2 class="screen-title">Tuner</h2>
    <div class="tuner">
      <div id="tuner-note" class="tuner-note">–</div>
      <div class="tuner-meter">
        <div class="tuner-center"></div>
        <div id="tuner-needle" class="tuner-needle" hidden></div>
      </div>
      <div class="tuner-scale"><span>♭ flat</span><span>sharp ♯</span></div>
      <div id="tuner-status" class="tuner-status">Play one string</div>
      <div id="tuner-freq" class="muted"></div>
    </div>
    <div class="status">
      <p id="tuner-msg" class="status-msg"></p>
      <p id="tuner-hint" class="status-hint"></p>
    </div>
    <p id="tuner-debug" class="debug-info" hidden></p>
    <button id="tuner-done-btn" class="big-btn bottom-btn">Done</button>
  </section>

  <!-- Saving confirmation -->
  <section id="screen-saving" class="screen" hidden>
    <h2 id="saving-title" class="saving-title">Saving…</h2>
    <p id="saving-details" class="saving-details"></p>
    <p id="saving-where" class="muted"></p>
  </section>

  <!-- Riff View: one saved riff -->
  <section id="screen-riff" class="screen" hidden>
    <button id="back-btn" class="back-btn">← Latest Riffs</button>
    <h2 id="riff-title" class="screen-title"></h2>
    <div id="riff-tab" class="tab"></div>
    <!-- This riff's tempo: type a new one to fix it (like an Auto guess that came out double or half speed) -->
    <label id="riff-tempo" class="riff-tempo">
      <span class="setting-label">Tempo</span>
      <input id="riff-bpm-input" class="bpm-input" type="number" inputmode="numeric" min="40" max="240" step="1" aria-label="This riff's tempo in beats per minute">
      <span class="setting-unit">BPM</span>
      <span id="riff-auto-tag" class="muted">auto</span>
    </label>
    <!-- Same confidence bar, for the saved riff (hidden for riffs saved before it existed) -->
    <div id="riff-confidence" class="confidence" hidden>
      <div class="confidence-label"><span>Confidence</span><span class="confidence-pct">–</span></div>
      <div class="confidence-bar" role="meter" aria-label="Confidence" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="confidence-fill"></div></div>
      <p class="confidence-hint"></p>
    </div>
    <p id="riff-count" class="muted"></p>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
